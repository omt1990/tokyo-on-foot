function inArea(s){return area==="all"?true:area==="23"?!!s[3]:CORE.has(s[3])}
function setArea(a){area=a;try{localStorage.setItem("ori.area",a)}catch(_){}for(const k in AREAS)document.getElementById(AREAS[k]).setAttribute("aria-pressed",k===a)}

function d(a,b){const y=(a[0]-b[0])*111,x=(a[1]-b[1])*111*Math.cos((a[0]+b[0])/2*R);return Math.hypot(x,y)}
function band(h){const c=h*4.5/1.3;return[c*0.8,c*1.2]}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function show(a,bName,bPos){cur=[a[0],bName,T[t].l];setShare();document.getElementById("pf").hidden=false;

}
function draw(w){
  w=w||1;let[lo,hi]=band(T[t].h);lo/=w;hi*=w;
  if(mode==="home"){
    const h=homeSt();if(!h){homeEl.setAttribute("aria-invalid","true");homeEl.focus();return}
    const H=[h[1],h[2]];
    const c=S.filter(s=>{const k=d([s[1],s[2]],H);return k>=lo&&k<=hi&&s[0]!==last&&s[0]!==h[0]&&inArea(s)});
    if(!c.length)return w<3&&draw(w*1.3);show(pick(c),h[0],H);
  }else{
    const pool=S.filter(inArea);
    for(let n=0;n<200;n++){const a=pick(pool);if(a[0]===last)continue;
      const c=pool.filter(s=>s!==a&&(k=>k>=lo&&k<=hi)(d([s[1],s[2]],[a[1],a[2]])));
      if(c.length){const b=pick(c);show(a,b[0],[b[1],b[2]]);return}}
    if(w<3)draw(w*1.3);
  }
}
